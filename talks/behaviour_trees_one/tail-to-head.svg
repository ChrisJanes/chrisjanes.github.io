<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 30 150 110">
  <style>
    :root {
      --color-a: #4285F4; /* Blue */
      --color-b: #DB4437; /* Red */
      --color-c: #0F9D58; /* Green */
      --color-helper: #757575; /* Grey */
    }
    .vector {
      stroke-width: 2;
      stroke-linecap: round;
    }
    .helper-line {
      stroke-width: 1.5;
      stroke-dasharray: 3 2;
    }
    .label {
      font-family: 'ui-sans-serif', 'system-ui', sans-serif;
      font-size: 10px;
      font-weight: bold;
      dominant-baseline: middle;
      text-anchor: middle;
    }
  </style>

  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse" fill="context-stroke">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <line class="helper-line" stroke="var(--color-b)" opacity="0.5" x1="100" y1="60" x2="160" y2="40" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-b)" opacity="0.5" x="135" y="40">
      <tspan>b</tspan><tspan dx="-0.30em" dy="-0.2em">&#8407;</tspan>
  </text>
  
  <line class="vector" stroke="var(--color-a)" x1="20" y1="60" x2="100" y2="60" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-a)" x="55" y="55">
    <tspan>a</tspan><tspan dx="-0.30em" dy="-0.1em">&#8407;</tspan>
  </text>
  
  <line class="vector" stroke="var(--color-b)" x1="100" y1="60" x2="40" y2="80" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-b)" x="75" y="80">
      <tspan>-b</tspan><tspan dx="-0.55em" dy="-0.2em">&#8407;</tspan>
  </text>

  <line class="vector" stroke="var(--color-c)" x1="20" y1="60" x2="37" y2="79" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-c)" x="23" y="75">
    <tspan>c</tspan><tspan dx="-0.25em" dy="-0.1em">&#8407;</tspan>
  </text>

  <text class="label" fill="var(--color-c)" x="90" y="100">
    <tspan>c</tspan><tspan dx="-0.25em" dy="-0.1em">&#8407;</tspan><tspan dx="0.25em" dy="0.1em"> = </tspan>a<tspan dx="-0.25em" dy="-0.1em">&#8407;</tspan> <tspan dx="0.25em" dy="0.1em">-</tspan> b<tspan dx="-0.25em" dy="-0.1em">&#8407;</tspan>
  </text>

  <text class="label" fill="var(--color-c)" x="97" y="112">
    <tspan>c</tspan><tspan dx="-0.25em" dy="-0.1em">&#8407;</tspan><tspan dx="0.25em" dy="0.1em"> = </tspan>a<tspan dx="-0.25em" dy="-0.1em">&#8407;</tspan> <tspan dx="0.25em" dy="0.1em">+</tspan> (-b)<tspan dx="-0.65em" dy="-0.1em">&#8407;</tspan>
  </text>

</svg>