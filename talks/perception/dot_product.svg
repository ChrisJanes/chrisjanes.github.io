<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 120 80">
  <style>
    .vector {
      stroke-width: 2;
      stroke-linecap: round;
    }
    .label {
      font-family: 'ui-sans-serif', 'system-ui', sans-serif;
      dominant-baseline: middle;
      text-anchor: middle;
    }
  </style>

  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="1" refY="5"
        markerWidth="3" markerHeight="3" orient="auto-start-reverse" fill="context-stroke">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

    <circle cx="20" cy="40" r="10" stroke="none" fill="orange"/>
    <text class="label" x="20" y="41" text-anchor="middle" font-size=".5em">A</text>

    <line x1="60" y1="0" x2="60" y2="100" stroke="turquoise" stroke-width=".5" />
  
    <circle cx="60" cy="80" r="10" stroke="none" fill="teal"/>
    <text class="label" x="60" y="81" text-anchor="middle" font-size=".5em">NPC</text>

    <line x1="70" y1="80" x2="80" y2="80" stroke="teal" stroke-dasharray="1" stroke-width="1" marker-end="url(#arrowHead)"/>

        <line x1="55" y1="71" x2="29" y2="49" stroke="red" stroke-dasharray="1" stroke-width="1" marker-end="url(#arrowHead)"/>
  
        <line x1="65" y1="71" x2="90" y2="48" stroke="green" stroke-dasharray="1" stroke-width="1" marker-end="url(#arrowHead)"/>
  
    <circle cx="100" cy="40" r="10" stroke="none" fill="orange"/>
    <text class="label" x="100" y="41" text-anchor="middle" font-size=".5em">B</text>
 
</svg>