<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 120 110">
  <style>
    :root {
      --color-a: #4285F4; /* Blue */
      --color-b: #DB4437; /* Red */
      --color-c: #0F9D58; /* Green */
      --color-helper: #757575; /* Grey */
    }
    .vector {
      stroke-width: 2;
      stroke-linecap: round;
    }
    .helper-line {
      stroke-width: 1.5;
      stroke-dasharray: 3 2;
    }
    .label {
      font-family: 'ui-sans-serif', 'system-ui', sans-serif;
      font-size: 10px;
      font-weight: bold;
      dominant-baseline: middle;
      text-anchor: middle;
    }
  </style>

  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse" fill="context-stroke">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <line class="vector" stroke="var(--color-a)" x1="20" y1="120" x2="40" y2="80" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-a)" x="35" y="110">
      <tspan>a</tspan><tspan dx="-0.30em" dy="-0.2em">&#8407;</tspan>
  </text>

    <line class="vector" stroke="var(--color-b)" x1="60" y1="120" x2="100" y2="40" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-b)" x="75" y="110">
      2<tspan>a</tspan><tspan dx="-0.30em" dy="-0.2em">&#8407;</tspan>
  </text>

  <line class="vector" stroke="var(--color-c)" x1="100" y1="120" x2="110" y2="100" marker-end="url(#arrowHead)"/>
  <text class="label" fill="var(--color-c)" x="125" y="110">
      0.5<tspan>a</tspan><tspan dx="-0.30em" dy="-0.2em">&#8407;</tspan>
  </text>

</svg>